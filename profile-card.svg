  </g>

  <!-- Right: Details -->
  <g transform="translate(360, 65)">
    <text y="0" class="text-body">
      <tspan class="prompt-user">sufal@portfolio</tspan><tspan class="prompt-path">:~/profile$ </tspan><tspan class="cmd">whoami</tspan>
    </text>

    <text y="32" class="name">Sufal KC</text>
    <text y="54" class="title-sub">Electronic Engineering Student</text>
    <text y="78" class="text-body">
      <tspan class="label">Portfolio: </tspan><tspan class="link">https://kcsufal.com.np/</tspan>
    </text>

    <text y="112" class="label">About:</text>
    <text y="132" class="text-body">Electronic engineering student with a strong portfolio</text>
    <text y="150" class="text-body">in designing, AI, and electronics. Passionate about</text>
    <text y="168" class="text-body">bridging hardware and intelligent systems — from</text>
    <text y="186" class="text-body">circuit design to building AI-driven solutions.</text>

    <text y="222" class="label">Stack:</text>
    <text y="242" class="text-body">C · Python · Embedded Systems · Arduino</text>
    <text y="260" class="text-body">Raspberry Pi · PCB Design · MATLAB</text>
    <text y="278" class="text-body">TensorFlow · Figma · AI/ML</text>
  </g>
