      <tspan x="169" dy="8.5px">*:::==++=-=+=+%+#*%##****##+-+#*#%#++%@%#%#@@%</tspan>
      <tspan x="169" dy="8.5px">=::=*=++:-*#**#*%%*=#%%%#+=-::%#-=#++%@%###@@@</tspan>
      <tspan x="169" dy="8.5px">==--:.--=**#**#++**:-+***=-: =%**#*++#%%*#*@@@</tspan>
      <tspan x="169" dy="8.5px">--+===+**##+******#-..:+++: .*#####********@@@</tspan>
      <tspan x="169" dy="8.5px">*=+*++********####%=.-#*=**:-#########*****%@@</tspan>
      <tspan x="169" dy="8.5px">*##=-=++**##%#####%*.:-**= .*##**##########%@@</tspan>
      <tspan x="169" dy="8.5px">++*%%###%###%%######: :**- :##*####%###%%%%%#*</tspan>
