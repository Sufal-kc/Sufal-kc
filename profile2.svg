      <tspan x="169" dy="8.5px">***+=#%%%%%%#%%%##%%%****%##%##%%%%##%@@@%@%**</tspan>
      <tspan x="169" dy="8.5px">%%%#%%%%%%%%%%%%##%%%***#%##%####%%#%%@@@@%%++</tspan>
      <tspan x="169" dy="8.5px">@@%@@##%@@@%%%%%#%%%#***#%##########%%%@@@@%%%</tspan>
      <tspan x="169" dy="8.5px">@@@@@%%%%%@%%%%%%%%%****###########%%##@@%%@%%</tspan>
      <tspan x="169" dy="8.5px">%%##%%%%%%%%%%%%%#%%****#%########%%##%%%%%%#%</tspan>
      <tspan x="169" dy="8.5px">%+-*%#%%%%%%%%%%%%%#*****%%%#####%%%#%%%%#%%##</tspan>
      <tspan x="169" dy="8.5px">+*@@%%%##%@%%%%%%%%%*****%%%%%##%%%%%%%%%%%@%#</tspan>
      <tspan x="169" dy="8.5px">-+#*#%###%%%%%%%%%%#*#***#%%%%%%%%%%%@@%%%%**@</tspan>
      <tspan x="169" dy="8.5px">######%%#%%%%%%%%%%@##**#@@%%%%%%%%@@%######+%</tspan>
      <tspan x="169" dy="8.5px">@@@%#%%%#@%%%%%%%%%@@##@@@@@%%%#%@@%#######%*#</tspan>
    </text>

    <!-- LIVE FEED Box Directly Below Portrait -->
    <g transform="translate(0, 318)">
      <rect class="live-box" x="0" y="0" width="338" height="102" rx="5" />
      <text class="live-feed" x="12" y="18" font-weight="bold" fill="#ea580c">|=== LIVE FEED =========================|</text>
      <text class="live-feed" x="12" y="38">| Recent Commits: [<tspan fill="#2563eb">======&gt;------------</tspan>] 68% |</text>
      <text class="live-feed" x="12" y="56">| Active Projects: [<tspan fill="#2563eb">&gt;&gt;-----------------</tspan>] 12% |</text>
      <text class="live-feed" x="12" y="74">| Latest Push:    <tspan class="link">feat/circuit-ai-bridge</tspan> |</text>
      <text class="live-feed" x="12" y="92">| Build Status:   [<tspan class="status-pass">PASS</tspan>] (0.5s ago)     |</text>
    </g>
  </g>

  <!-- Right Column: Profile Information -->
  <g transform="translate(388, 68)">
    <text y="0" class="text-body">
      <tspan class="prompt-user">sufal@portfolio</tspan><tspan class="prompt-path">:~/profile$ </tspan><tspan class="cmd">whoami</tspan>
    </text>

    <text y="32" class="name">Sufal KC</text>
    <text y="54" class="title-sub">Electronic Engineering Student</text>
    <text y="78" class="text-body">
      <tspan class="label">Portfolio: </tspan><tspan class="link">https://kcsufal.com.np/</tspan>
    </text>

    <text y="112" class="label">About:</text>
    <text y="132" class="text-body">Electronic engineering student with a strong portfolio</text>
    <text y="150" class="text-body">in designing, AI, and electronics. Passionate about</text>
    <text y="168" class="text-body">bridging hardware and intelligent systems — from</text>
    <text y="186" class="text-body">circuit design to building AI-driven solutions.</text>

    <text y="222" class="text-body">
      <tspan class="label">Stack : </tspan><tspan>C · Python · Embedded Systems · Arduino</tspan>
    </text>
    <text y="240" class="text-body">
      <tspan fill="none">        </tspan><tspan>Raspberry Pi · PCB Design · MATLAB</tspan>
    </text>
    <text y="258" class="text-body">
      <tspan fill="none">        </tspan><tspan>TensorFlow · Figma · AI/ML</tspan>
    </text>

    <text y="296" class="label">GitHub Stats:</text>
    <text y="316" class="text-body">
      . Repos: .... 24 {<tspan fill="#d97706">Contributed: 31</tspan>} | Stars: ........... 18
    </text>
    <text y="334" class="text-body">
      . Commits: .................. 1,240 | Followers: ....... 28
    </text>
    <text y="352" class="text-body">
      . Lines of Code:. 245,134 ( <tspan fill="#10b981">412,932++</tspan>, <tspan fill="#ef4444">167,798--</tspan> )
    </text>
    <text y="370" class="text-body">
      . Streak: ..... 5 days current | Longest: .... 42 days
    </text>
  </g>
</svg>
