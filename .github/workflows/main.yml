name: GitHub Metrics

on:
  # Daily at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/main.yml"

# Shared with update_profile.yml so the two workflows never push at the same time
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The card adapts to light and dark themes on its own, so one file is enough
      - name: Generate Metrics Card
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kathmandu
