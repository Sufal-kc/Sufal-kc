name: Update Profile Card & Snake

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update_profile.yml"
      - "scripts/**"
      - "profile*.svg"
      - "README.md"

# Shared with main.yml so the two workflows never push at the same time
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: pip install requests

      - name: Update Terminal Card SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_card.py

      - name: Generate Contribution Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            metrics/snake-light.svg?palette=github-light
            metrics/snake-dark.svg?palette=github-dark

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile card stats and snake SVGs [skip ci]"
          file_pattern: "profile*.svg metrics/snake-*.svg"
