name: Generate Contribution Snake

on:
  schedule:
    # Run automatically every 12 hours
    - cron: "0 */12 * * *"
  
  # Allows manual execution anytime from the Actions tab
  workflow_dispatch:

  # Runs whenever you push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            metrics/light_mode.svg?palette=github-light
            metrics/dark_mode.svg?palette=github-dark

      - name: Commit and Push Updated Metrics
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution snake animation [skip ci]"
          file_pattern: "metrics/*.svg"